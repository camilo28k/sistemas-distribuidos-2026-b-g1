name: IAM security gates

# Proposal for dlc-iam-api/.github/workflows/security.yml after team review.
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact --exit-code 1 --source .
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Audit Java dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          test -n "$NVD_API_KEY"
          mvn -B -ntp -DnvdApiKeyEnvironmentVariable=NVD_API_KEY -DfailBuildOnCVSS=7 -DfailOnError=true org.owasp:dependency-check-maven:12.1.0:check
      - name: Test negative staff-unlock authorization
        run: mvn -B -ntp -pl iam-app -am -Dtest=ForgedIdentityUnlockTest -Dsurefire.failIfNoSpecifiedTests=false test
